<style>
  :root { --bg: #f4f3ef; --fg: #111111; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #ffffff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  /* Fixed full-viewport stage: elements injected into <body> by extensions can't shift the centering */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; animation: fadeIn 1.2s ease-out 0.4s forwards; }
  /* Vignette: background dissolves toward the corners */
  #bg { -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 100%); mask-image: radial-gradient(ellipse at center, #000 35%, transparent 100%); }
  main { position: fixed; inset: 0; display: grid; place-items: center; }
  h1 { margin: 0; }
  .logo { display: block; width: min(300px, 70vw); height: auto; opacity: 0; animation: fadeIn 0.35s ease-out forwards, imageIn 0.5s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes imageIn { 0% { filter: blur(12px); transform: scale(0.9); } 50% { filter: blur(12px); transform: scale(1); } 100% { filter: blur(0px); transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: fadeIn 0.35s ease-out forwards; } #bg { animation: fadeIn 0.35s ease-out forwards; } }

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GRID = 48, MAJOR = 5;
  const K = 5, EXIT = 0.84;                 // steepness; fraction of width where the curve leaves the top
  const DELAY = 500, DRAW = 3500, TRAVEL = 7000, PAUSE = 1200, TRAIL = 180;
  let w, h, ink, pts = [], t0 = null;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ink = getComputedStyle(document.body).color.match(/\d+/g).slice(0, 3).join(',');
    // y = e^(Kx), scaled so it hugs the bottom-left and exits the top at EXIT * width
    const norm = Math.exp(K * EXIT) - 1;
    pts = [];
    for (let x = 0, s = 0; x <= w; x += 2) {
      const y = h * (1 - (Math.exp(K * x / w) - 1) / norm);
      const prev = pts[pts.length - 1];
      if (prev) s += Math.hypot(x - prev.x, y - prev.y);
      pts.push({ x, y, s });
      if (y < -20) break;
    }
  }

  function drawGrid() {
    ctx.lineWidth = 1;
    for (let i = 0, x = 0.5; x < w; i++, x += GRID) {
      ctx.strokeStyle = `rgba(${ink},${i % MAJOR ? 0.035 : 0.07})`;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let i = 0, y = h - 0.5; y > 0; i++, y -= GRID) {
      ctx.strokeStyle = `rgba(${ink},${i % MAJOR ? 0.035 : 0.07})`;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
  }

  function drawCurve(end) {
    ctx.strokeStyle = `rgba(${ink},0.2)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i <= end; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  // Bright tail behind the tracer, fading out over TRAIL px of arc length
  function drawTracer(i) {
    const tip = pts[i];
    ctx.lineWidth = 1.5;
    for (let j = i; j > 0 && tip.s - pts[j].s < TRAIL; j--) {
      ctx.strokeStyle = `rgba(${ink},${0.55 * (1 - (tip.s - pts[j].s) / TRAIL)})`;
      ctx.beginPath(); ctx.moveTo(pts[j - 1].x, pts[j - 1].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
    }
    ctx.fillStyle = `rgba(${ink},0.75)`;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function frame(now) {
    if (t0 === null) t0 = now;
    const t = now - t0 - DELAY;
    const last = pts.length - 1;
    ctx.clearRect(0, 0, w, h);
    drawGrid();
    if (t > 0 && t < DRAW) {
      const i = Math.round(last * t / DRAW);
      drawCurve(i);
      drawTracer(i);
    } else if (t >= DRAW) {
      drawCurve(last);
      const lt = (t - DRAW) % (TRAVEL + PAUSE);
      if (lt < TRAVEL) drawTracer(Math.round(last * lt / TRAVEL));
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resize);
  resize();
  if (reduced) { drawGrid(); drawCurve(pts.length - 1); }
  else requestAnimationFrame(frame);
})();
</script>
